name: Deploy Firestore rules

# Auto-deploys on push to main when the rules/index files change, plus a manual
# trigger. Auto-deploy was enabled 2026-07-31 after the group-aware client + the
# strict group-scoped rules both went live in prod (the earlier hazard — publishing
# strict rules while the old global-read client was live — no longer applies).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Authenticate the Firebase CLI with a service account (no interactive login).
      # Add the same JSON you use locally (FIREBASE_SERVICE_ACCOUNT) as a repo secret.
      - name: Write service account key
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx firebase-tools@latest deploy --only firestore:rules --project soup-pick-em --non-interactive
