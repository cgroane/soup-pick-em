name: PR checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Sync Lock File
        run: npm i
      
      - name: Sync GCF Lock File
        run: npm --prefix functions i

      - name: Install dependencies
        run: npm ci

      - name: Install GCF dependencies
        run: npm --prefix functions ci

      - name: Build
        run: npm run build

      - name: Test
        env:
          CI: true
        run: npm test -- --watch=false --passWithNoTests


  validate-firestore-rules:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write service account key
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Validate Firestore rules (dry-run compile)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx firebase-tools@latest deploy --only firestore:rules --project soup-pick-em --dry-run --non-interactive
